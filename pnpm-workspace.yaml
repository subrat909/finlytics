packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"
  - "!apps/ai-engine"

# One version per dependency across the monorepo (plan D19). Reference an entry with "catalog:" in package.json.
catalog:
  typescript: "~6.0.3"
  zod: "^4.6.5"
  decimal.js: "^10.6.0"
  # vitest and its coverage provider are an exact pair: always bump them together.
  vitest: "5.0.3"
  "@vitest/coverage-v8": "5.0.3"
  tsdown: "0.23.0"
  # The Prisma trio moves together, at exact versions. npm `latest` for prisma is an 8.x release candidate (a
  # different product): never `pnpm add prisma` without a version.
  prisma: "7.10.0"
  "@prisma/client": "7.10.0"
  "@prisma/adapter-pg": "7.10.0"
  # Required by every package that uses the @finlytics/tsconfig node preset (`types: ["node"]`).
  "@types/node": "^24.19.1"
  # Phase 0.4 (packages/ui). Families that move in lockstep: react + react-dom (exact pair); tailwindcss +
  # @tailwindcss/vite (exact pair); every storybook package (one version); vitest + @vitest/browser +
  # @vitest/browser-playwright (exact, same as vitest); playwright + @playwright/test + the CI image tag.
  react: "19.3.0"
  react-dom: "19.3.0"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  tailwindcss: "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  tw-animate-css: "^1.4.0"
  radix-ui: "^1.6.7"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^3.7.0"
  lucide-react: "^1.52.0"
  next-themes: "0.4.6"
  "@fontsource-variable/inter": "^5.3.0"
  "@fontsource-variable/jetbrains-mono": "^5.3.0"
  storybook: "10.6.1"
  "@storybook/react-vite": "10.6.1"
  "@storybook/addon-a11y": "10.6.1"
  "@storybook/addon-themes": "10.6.1"
  "@storybook/addon-vitest": "10.6.1"
  vite: "^8.3.2"
  "@vitejs/plugin-react": "^6.1.2"
  "@vitest/browser": "5.0.3"
  "@vitest/browser-playwright": "5.0.3"
  playwright: "1.63.0"
  "@playwright/test": "1.63.0"
  jsdom: "^30.1.2"
  "@testing-library/react": "^16.3.3"
  "@testing-library/dom": "^10.4.2"
  "@testing-library/user-event": "^14.6.7"
  "@testing-library/jest-dom": "^7.0.1"
  vitest-axe: "0.1.0"
  axe-core: "^4.14.0"
  # Phase 0.5 (apps/api) and shared test tooling.
  testcontainers: "^12.2.0"
  "@testcontainers/postgresql": "^12.2.0"
  "@testcontainers/redis": "^12.2.0"
  fast-check: "^4.10.2"
  # Phase 0.6 (apps/web). next and @next/eslint-plugin-next move together.
  next: "16.3.8"
  "@next/eslint-plugin-next": "16.3.8"
  next-auth: "5.0.0-beta.32"

# pnpm 10 runs no dependency build scripts unless allowed here (install scripts are a common supply-chain attack
# vector). Every package with a build script must be in exactly one list; `pnpm ignored-builds` shows unlisted ones.
onlyBuiltDependencies:
  # Downloads the schema engine binary that `prisma migrate` needs.
  - "@prisma/engines"
  - prisma
  # Verifies the platform binary.
  - esbuild
ignoredBuiltDependencies:
  # Optional native speed-ups pulled in by testcontainers (ssh2 → cpu-features); both fall back to plain JS.
  - cpu-features
  - ssh2
  # Postinstall only prints a version notice.
  - protobufjs
  # Install-time telemetry from swagger-ui-dist (via @nestjs/swagger); nothing to build.
  - "@scarf/scarf"
  # Optional native speed-up for msgpackr (via bullmq); falls back to plain JS.
  - msgpackr-extract

# @nestjs/platform-fastify 11.2.7 (the last Nest 11 release) pins fastify 5.11.3, which has four high advisories
# (GHSA-667r-xxjv-c9mm, GHSA-p68q-wchp-6fh7, GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58), all fixed in 5.12.2. This keeps
# one fastify copy in the workspace, at a patched 5.x; apps/api pins the same version. Scoped to that exact pin, so it
# never rewrites another package's fastify range. Drop it when Nest moves past 11.
overrides:
  "fastify@5.11.3": "5.12.5"
  # @nestjs/swagger 11.4.7 (the last 11.x) pins js-yaml 5.3.0: GHSA-r3ph-w7gj-g6xm (moderate, CPU use on empty merge
  # sources), fixed in 5.4.1. Same reasoning as fastify; drop it with the Nest 11 line.
  "js-yaml@5.3.0": "5.4.2"
